# Every pull request and every push to main (issue #1, item 2). Required by main's branch protection.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet, race tests, tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      # Includes the schema tests: /discovery against livepeer/node's own schema at the pinned commit.
      - run: go test -race ./...
